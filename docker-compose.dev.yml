# Local development override.
# Usage (the bundled-redis profile starts a local Redis alongside the app):
#   COMPOSE_PROFILES=bundled-redis \
#     docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# Tip: put COMPOSE_PROFILES=bundled-redis in your .env to avoid typing it.
# If you instead use an external Redis, set REDIS_URL and drop the profile
# (also remove the depends_on below, since there is no local redis service).
#
# Adds live source mounts and publishes the API port on the host.

services:
  web-browsers:
    environment:
      - NODE_ENV=development
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    ports:
      - "${API_PORT:-3030}:3030"
    volumes:
      - ./src:/home/app/src
      - ./util:/home/app/util
      - /dev/shm:/dev/shm
      # Local config (optional; the app also reads ACCESS_KEYS from the environment)
      - ./.env:/home/app/.env
      - ./accessKeys.json:/home/app/accessKeys.json
    depends_on:
      redis:
        condition: service_healthy

  redis:
    ports:
      - "6379:6379"
