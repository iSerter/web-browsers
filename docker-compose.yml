version: '3.8'

services:
  web-browsers:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: web-browsers-app
    ports:
      - "3030:3030"
    environment:
      - NODE_ENV=production
      - LANG=en_US.UTF-8
      - PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/google-chrome
      - XDG_CONFIG_HOME=/tmp/.chromium-config
      - XDG_CACHE_HOME=/tmp/.chromium-cache
      - XDG_RUNTIME_DIR=/tmp/runtime-dbus
      - DBUS_SESSION_BUS_ADDRESS=unix:path=/tmp/runtime-dbus/bus
    volumes:
      # Mount application code for development (optional - comment out for production)
      - ./src:/home/app/src
      - ./util:/home/app/util
      - ./logs:/home/app/logs
      # Share /dev/shm to prevent Chrome crashes
      - /dev/shm:/dev/shm
    shm_size: '2gb'
    # Required for Chrome to run properly
    cap_add:
      - SYS_ADMIN
    # Security options for Chrome sandbox
    security_opt:
      - seccomp:unconfined
    restart: unless-stopped
    networks:
      - web-browsers-network
      - sg-network

networks:
  web-browsers-network:
    driver: bridge
  sg-network:
    external: true